name: CI Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Run Backend Static Security Audit
      run: bandit -r backend/ -ll

    - name: Run Backend Tests & Coverage
      run: |
        export TESTING=True
        pytest backend/tests/ --cov=backend --cov-report=xml

    - name: Run Frontend Lint & Type Checks
      run: |
        npm run lint
        npm run typecheck

    - name: Run Frontend Unit Tests
      run: npm run test:unit

    - name: Run Production Bundle Build
      run: npm run build
